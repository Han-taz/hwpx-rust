[package]
name = "hwpx-python"
version = "0.2.1"
edition = "2021"
authors = ["kevin <ftkevin12@gmail.com>"]
license = "MIT"
description = "Python bindings for HWP/HWPX document parser"
homepage = "https://github.com/Han-taz/hwpx-rust"
repository = "https://github.com/Han-taz/hwpx-rust"
readme = "README.md"
keywords = ["hwp", "hwpx", "hancom", "parser"]
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[features]
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]

[dependencies]
pyo3 = { version = "0.29", features = ["abi3-py38"] }
hwp-core = { path = "../../crates/hwp-core" }
serde_json = "1.0"
